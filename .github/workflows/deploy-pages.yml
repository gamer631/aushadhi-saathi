name: Build and deploy web app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract app source
        run: unzip -q aushadhi-saathi-source.zip -d source

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze
        working-directory: source
        run: flutter analyze

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Build web release
        working-directory: source
        shell: bash
        run: |
          base_href="/${GITHUB_REPOSITORY#*/}/"
          flutter build web --release --base-href "$base_href"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
